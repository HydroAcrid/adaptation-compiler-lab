[package]
name = "temper-hook-helper"
version = "0.3.0-alpha.2"
description = "Temper Claude Code hook transport"
edition = "2024"
rust-version = "1.85"
default-run = "temper-hook"

[lib]
name = "temper_hook_transport"

[[bin]]
name = "temper-hook"
path = "src/main.rs"

[dependencies]
interprocess = "=2.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
