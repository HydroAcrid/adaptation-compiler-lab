[package]
name = "temper-desktop"
version = "0.3.0-alpha.2"
description = "Temper governed learning desktop shell"
edition = "2024"
rust-version = "1.85"
default-run = "temper-desktop"

[lib]
name = "temper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "=2.11.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
uuid = { version = "1.18", features = ["v4"] }
temper-hook-transport = { path = "../hook-helper", package = "temper-hook-helper" }

[dev-dependencies]
tempfile = "3.21"

# Native debug symbols and incremental objects previously occupied >12 GiB.
# One ordinary development/test target must remain affordable on a user machine.
[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
