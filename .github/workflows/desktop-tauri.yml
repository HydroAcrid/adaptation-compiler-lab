name: Temper desktop

on:
  pull_request:
    paths:
      - "desktop_ui/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/adaptation_compiler_lab/desktop/**"
      - "tests/unit/desktop/**"
      - ".github/workflows/desktop-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract:
    name: ${{ matrix.os }} native contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: desktop_ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop_ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - name: Create non-bundled contract sidecar placeholder
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $extension = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          $binaryRoot = "src-tauri/binaries"
          New-Item -ItemType Directory -Path $binaryRoot -Force | Out-Null
          $placeholder = Join-Path $binaryRoot "temper-engine-$triple$extension"
          [System.IO.File]::WriteAllBytes($placeholder, [byte[]](0))
          if ("${{ runner.os }}" -ne "Windows") {
            chmod +x $placeholder
          }
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-package-candidate:
    name: Windows package candidate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop_ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Install locked Python environment
        run: uv sync --locked --dev --group release
      - name: Build target-bound engine sidecar
        run: uv run python packaging/build_native.py
      - name: Install desktop dependencies
        working-directory: desktop_ui
        run: pnpm install --frozen-lockfile
      - name: Build unsigned internal NSIS candidate
        working-directory: desktop_ui
        run: pnpm tauri build --bundles nsis
      - name: Stage ephemeral candidate
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "temper-package-candidate"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          $installer = Get-ChildItem `
            -LiteralPath "desktop_ui/src-tauri/target/release/bundle/nsis" `
            -Filter "*-setup.exe" `
            -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Tauri did not produce a Windows installer."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination $candidateRoot
      - uses: actions/upload-artifact@v4
        with:
          name: temper-windows-unsigned-smoke-candidate
          path: ${{ runner.temp }}/temper-package-candidate/*
          if-no-files-found: error
          retention-days: 1

  windows-clean-smoke:
    name: Windows clean-runner smoke
    needs: windows-package-candidate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: temper-windows-unsigned-smoke-candidate
          path: ${{ runner.temp }}/temper-package-candidate
      - name: Install, handshake, launch, and clean up
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -LiteralPath (Join-Path $env:RUNNER_TEMP "temper-package-candidate") `
            -Filter "*-setup.exe" `
            -File |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "The package candidate is unavailable."
          }
          ./packaging/windows/smoke_package.ps1 `
            -InstallerPath $installer.FullName `
            -SignaturePolicy development
