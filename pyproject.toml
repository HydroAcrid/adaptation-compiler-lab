[project]
name = "adaptation-compiler-lab"
version = "0.3.0a2"
description = "Governed behavior compiler and private desktop alpha for coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44,<47",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "rich>=14,<16",
    "typer>=0.15,<1",
]

[project.scripts]
adaptation-compiler-lab = "adaptation_compiler_lab.cli:app"
temper = "adaptation_compiler_lab.temper_cli:app"
temper-engine = "adaptation_compiler_lab.desktop.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "types-jsonschema>=4.23",
]
release = [
    "nuitka>=2.7,<3",
    "pip>=25,<27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptation_compiler_lab"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["**/anonymous-outputs/**"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["adaptation_compiler_lab"]
